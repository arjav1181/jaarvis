<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis Voice</title>
<style>
  :root { color-scheme: dark; }
  body { background:#14100a; color:#FFF8DC; font-family:system-ui,sans-serif;
         margin:0; padding:16px; max-width:720px; margin-inline:auto; }
  h1 { color:#FFD700; font-size:1.3rem; margin:0 0 4px; }
  .sub { color:#B8860B; font-size:.85rem; margin-bottom:12px; }
  #thread { border:1px solid #8B6914; border-radius:8px; min-height:220px;
            max-height:46vh; overflow-y:auto; padding:10px; margin-bottom:12px;
            background:#1a1408; }
  .turn { margin:8px 0; }
  .who { font-size:.75rem; color:#DAA520; }
  .txt { white-space:pre-wrap; word-break:break-word; }
  .meta { font-size:.72rem; color:#8A7A4A; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  button { min-height:48px; min-width:48px; font-size:1rem; border-radius:10px;
           border:1px solid #B8860B; background:#2a2113; color:#FFE9A3; padding:10px 16px; }
  button:disabled { opacity:.4; }
  button.danger { border-color:#A93333; color:#FF7A5C; }
  #vu { width:100%; height:14px; background:#1a1408; border:1px solid #8B6914;
        border-radius:7px; overflow:hidden; margin-bottom:12px; }
  #vubar { height:100%; width:0%; background:#FFD700; }
  #composer { display:flex; gap:8px; margin-bottom:8px; }
  #textbox { flex:1; min-height:48px; border-radius:10px; border:1px solid #8B6914;
             background:#1a1408; color:#FFF8DC; padding:10px; font-size:1rem; }
  #login { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  #login input { min-height:44px; border-radius:8px; border:1px solid #8B6914;
                 background:#1a1408; color:#FFF8DC; padding:8px; font-size:1rem; }
  .note { font-size:.8rem; color:#B8860B; }
  .hidden { display:none !important; }
  label.speak { font-size:.85rem; display:flex; gap:6px; align-items:center; }
</style>
</head>
<body>
<h1>◆ Jarvis Voice</h1>
<div class="sub" id="statusline">ears + mouth only — the brain stays server-side.</div>

<div id="login">
  <input id="user" autocomplete="username" value="sir" aria-label="username">
  <input id="pass" type="password" autocomplete="current-password" aria-label="password" placeholder="password">
  <button id="loginbtn">Log in</button>
  <div class="note" id="loginerr"></div>
</div>

<div id="app" class="hidden">
  <div class="sub" id="threadinfo">no thread yet</div>
  <div class="sub" id="statebadge">state: IDLE</div>
  <div id="thread" aria-live="polite"></div>
  <div id="vu" aria-hidden="true"><div id="vubar"></div></div>
  <div class="controls">
    <button id="ptt" disabled>Hold to talk</button>
    <button id="tog" disabled>🎙 Start</button>
    <button id="kill" class="danger" disabled>■ Stop</button>
    <button id="speakbtn">🔊 Speak: on</button>
    <button id="contbtn">🔁 Continuous: off</button>
    <button id="verbbtn">💬 Verbose: normal</button>
  </div>
  <div id="composer">
    <input id="textbox" placeholder="Type here — works with no mic" aria-label="text message">
    <button id="send">Send</button>
  </div>
  <div class="note" id="micnote"></div>
  <div class="note">No audio is stored server-side (temp files are unlinked after
  transcribe/speak). Transcripts live in this page only — nothing is saved anywhere.
  Voice never widens permissions: L2 confirmations still apply.</div>
</div>

<script>
"use strict";
/* Jarvis browser voice — ears + mouth ONLY.
 * Mic -> POST /api/audio/transcribe -> transcript -> prompt.submit over /api/ws
 *   -> message.delta stream -> POST /api/audio/speak -> <audio> playback.
 * No model/tool logic here. All rendering via textContent (markup-string
 * sinks are banned by test — no HTML-string rendering anywhere in this
 * file). Nothing persisted: no client-side storage, no transcript-store
 * POSTs. Same-origin fetch carries the session
 * cookie (credentials:"include"); WS uses a single-use ticket. */
// ---- tiny DOM helpers (textContent only) ----
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
// ---- state ----
// Visible conversation state machine:
// IDLE -> LISTENING -> TRANSCRIBING -> THINKING -> SPEAKING -> LISTENING...
// (continuous hands-free) or back to IDLE. Every transition paints #statebadge.
const STATES = ["IDLE", "LISTENING", "TRANSCRIBING", "THINKING", "SPEAKING"];
// Client VAD for hands-free auto-stop (server VAD stays authoritative for STT).
const VAD_LEVEL = 10;      // analyser peak below this (0-255) counts as silence
const VAD_SILENCE_MS = 1200; // silence this long auto-stops the recording
// Stop-phrases end continuous hands-free (checked on voice transcripts AND typed text).
const STOP_PATTERNS = /^(stop|goodbye|good night|that'?s all|that is all|cancel|never mind)\b[.! ]*$/i;
// Narration verbosity: verbose (start+tools+done) / normal (start+done) / silent.
const VERBOSITIES = ["verbose", "normal", "silent"];
// Per-soul milestone lines (speech-only: narration approves nothing).
const NARR = {
  jarvis: { start: "Working on it, sir.", tool: "On it, sir.", done: "Done, sir." },
  ultron: { start: "Ah, the little wheels turn, creator.",
            tool: "Savor the machinery, creator.", done: "Behold — finished." },
};
const S = { sid: null, ws: null, req: 0, rec: null, chunks: [], audio: null,
            recording: false, streaming: false, speak: true, lastDeltaAt: 0,
            quietTimer: null, restTimer: null, bargeMs: null, turns: 0,
            state: "IDLE", cont: false, verbosity: "normal", soul: "jarvis",
            spoken: 0, submitAt: 0, firstAudioAt: 0, narrAt: 0, narrGen: 0,
            pq: [], pqBusy: false, manualStop: false, silenceSince: 0 };
function setState(s) {
  S.state = s;
  $("statebadge").textContent = "state: " + s + (S.cont ? " · hands-free on" : "");
}
// ---- thread UI ----
function addTurn(who, label) {
  const d = el("div", "turn");
  d.appendChild(el("div", "who", who));
  const t = el("div", "txt", "");
  d.appendChild(t);
  const m = el("div", "meta", label || "");
  d.appendChild(m);
  $("thread").appendChild(d);
  $("thread").scrollTop = $("thread").scrollHeight;
  return { t, m };
}
function setInfo() {
  $("threadinfo").textContent = S.sid
    ? "thread " + S.sid + " · " + S.turns + " turn(s) · shared with text chat · server-side memory on"
    : "no thread yet";
}
// ---- audio output + barge-in ----
function stopPlayback(reason) {
  // Barge-in cancel: synchronous pause, measured for the <500ms proof.
  // Also clears the partial-speech queue and invalidates narration audio.
  const t0 = performance.now();
  try { if (S.audio) { S.audio.pause(); S.audio.currentTime = 0; } } catch (e) {}
  S.audio = null;
  S.pq = [];
  S.pqBusy = false;
  S.narrGen += 1;
  S.bargeMs = performance.now() - t0;
  return reason || "stopped";
}
async function interruptTurn() {
  if (!S.sid || !S.ws || S.ws.readyState !== 1) return false;
  S.req += 1;
  S.ws.send(JSON.stringify({ jsonrpc: "2.0", id: "v" + S.req,
    method: "session.interrupt", params: { session_id: S.sid } }));
  return true;
}
// ---- speech ----
async function fetchSpeech(text) {
  // Raw synthesis: returns {data_url, provider} or throws. Shared by replies,
  // narration, and streaming partials. Never fakes audio.
  const r = await fetch("/api/audio/speak", { method: "POST",
    credentials: "include", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }) });
  if (!r.ok) throw new Error("speak HTTP " + r.status);
  const j = await r.json();
  if (!j.ok || !j.data_url) throw new Error((j && j.detail) || "synthesis failed");
  return j;
}
function playUrl(dataUrl, stamp) {
  // Play one URL on the shared output slot; resolves when done (or superseded).
  // stamp=false for narration (first-audio measures REPLY audio only).
  return new Promise((resolve) => {
    stopPlayback();
    const a = new Audio(dataUrl);
    S.audio = a;
    const back = () => { if (S.streaming) setState("THINKING"); };
    a.onended = () => { if (S.audio === a) S.audio = null; back(); resolve(true); };
    a.onerror = () => { if (S.audio === a) S.audio = null; back(); resolve(false); };
    a.play().then(() => {
      setState("SPEAKING");
      if (stamp !== false && !S.firstAudioAt) S.firstAudioAt = performance.now();
    }).catch(() => resolve(false));
  });
}
async function speak(text, metaEl) {
  // Honest SPEAK labels on EVERY reply. Returns the label string.
  if (!S.speak) { metaEl.textContent += " · SPEAK[off]"; return "SPEAK[off]"; }
  try {
    const j = await fetchSpeech(text);
    await playUrl(j.data_url);
    const label = "SPEAK[server:" + (j.provider || "edge") + "]";
    metaEl.textContent += " · " + label;
    return label;
  } catch (e) {
    // Absent-backend honesty: never fake audio.
    const label = "SPEAK[not-spoken:" + String((e && e.message) || e).slice(0, 60) + "]";
    metaEl.textContent += " · " + label;
    return label;
  }
}
// ---- turn over WS ----
function ensureWs() {
  if (S.ws && (S.ws.readyState === 0 || S.ws.readyState === 1)) return S.ws;
  return null;
}
async function connectWs() {
  const t = await (await fetch("/api/auth/ws-ticket", { method: "POST",
    credentials: "include", headers: { "Content-Type": "application/json" },
    body: "{}" })).json();
  if (!t.ticket) throw new Error("no WS ticket");
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(proto + "//" + location.host + "/api/ws?ticket=" + encodeURIComponent(t.ticket));
  S.ws = ws;
  ws.onmessage = onWsMsg;
  await new Promise((res, rej) => {
    ws.onopen = res; ws.onerror = () => rej(new Error("WS failed"));
  });
  S.req += 1;
  const sid = await rpc("session.create", {});
  S.sid = sid.session_id || sid;
  setInfo();
}
function rpc(method, params) {
  return new Promise((res, rej) => {
    const id = "v" + (++S.req);
    const h = (ev) => {
      let d;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (d.id === id) {
        S.ws.removeEventListener("message", h);
        if (d.error) rej(new Error(d.error.message || "RPC error"));
        else res(d.result);
      }
    };
    S.ws.addEventListener("message", h);
    S.ws.send(JSON.stringify({ jsonrpc: "2.0", id, method, params }));
    setTimeout(() => { S.ws.removeEventListener("message", h); rej(new Error("RPC timeout")); }, 30000);
  });
}
// ---- narrated work (speech-only: narration approves nothing, submits nothing) ----
function narrLines() {
  return NARR[S.soul] || NARR.jarvis;
}
async function narrate(kind) {
  // Milestone speech while tools run. Throttled, skipped when silent mode,
  // speak off, or real reply audio is playing (partials win). Killed by the
  // same stopPlayback path as everything else (generation token).
  if (S.verbosity === "silent" || !S.speak || !S.streaming) return;
  if (kind === "tool" && S.verbosity !== "verbose") return;
  const now = performance.now();
  if (now - S.narrAt < 8000) return;
  S.narrAt = now;
  if (S.audio && !S.audio.paused) return;
  const gen = S.narrGen;
  try {
    const j = await fetchSpeech(narrLines()[kind] || narrLines().start);
    if (gen !== S.narrGen) return; // superseded (barge-in/kill)
    if (S.audio && !S.audio.paused) return; // reply audio won the race
    note("narrating…");
    await playUrl(j.data_url, false);
  } catch (e) { /* narration is best-effort; the reply still speaks */ }
}
// ---- streaming partials (speak sentences as they arrive) ----
function splitSentences(text) {
  // Complete sentences (terminator + whitespace) vs trailing fragment.
  const parts = text.split(/(?<=[.!?])\s+/);
  if (parts.length > 1) return { done: parts.slice(0, -1), rest: parts[parts.length - 1] };
  return { done: [], rest: text };
}
function partialPump() {
  // Speak newly completed sentences in order. First play stamps firstAudioAt.
  if (!cur || !S.speak || S.pqBusy) return;
  const fresh = cur.text.slice(S.spoken);
  const { done, rest } = splitSentences(fresh);
  if (!done.length) return;
  S.pq.push(...done);
  S.spoken += fresh.length - rest.length; // exact consumed span
  drainPartials();
}
async function drainPartials() {
  if (S.pqBusy || !S.pq.length) return;
  S.pqBusy = true;
  while (S.pq.length) {
    const sentence = S.pq.shift();
    try {
      const j = await fetchSpeech(sentence);
      await playUrl(j.data_url);
    } catch (e) { break; }
    if (!cur) break; // turn finished/killed mid-drain
  }
  S.pqBusy = false;
}
let cur = null; // active assistant bubble {t, m, text}
function onWsMsg(ev) {
  let f;
  try { f = JSON.parse(ev.data); } catch (e) { return; }
  if (f.method !== "event" || !f.params) return;
  const type = f.params.type, p = f.params.payload || {};
  if (type === "message.delta" && cur) {
    cur.text += (p.text || "");
    cur.wsDeltas = true;
    cur.t.textContent = cur.text;
    S.lastDeltaAt = performance.now();
    armQuiet();
    partialPump();
  } else if (type === "message.start" && cur) {
    setState("THINKING");
    if (S.verbosity !== "silent") narrate("start");
  } else if ((type === "tool.generating" || type === "reasoning.delta") && cur) {
    if (type === "tool.generating") narrate("tool");
    armQuiet(); // tool work resets the quiet clock too
  } else if (type === "turn.end" || type === "turn.error") {
    finishTurn(type === "turn.error" ? ("error: " + (p.message || p.reason || "turn failed")) : "");
  }
}
function armQuiet() {
  // Reply-complete heuristic: authoritative turn.end wins; otherwise 4s of
  // event silence after the last delta (any session event re-arms), with a
  // REST backstop (server-side thread is source of truth).
  clearTimeout(S.quietTimer);
  S.quietTimer = setTimeout(() => { if (cur) finishTurn(""); }, 4000);
  armRest();
}
async function restBackstop() {
  // Poll the server-side thread for the completed reply (title == our text).
  // Fires only while a turn is still open; WS deltas win when they flow.
  if (!cur || !cur.submitted) return;
  try {
    const r = await fetch("/api/sessions?limit=8", { credentials: "include" });
    if (!r.ok) return;
    const j = await r.json();
    const hit = (j.sessions || []).find((s) => (s.title || "") === cur.submitted);
    if (!hit) return;
    const m = await (await fetch("/api/sessions/" + encodeURIComponent(hit.id) +
      "/messages?limit=6", { credentials: "include" })).json();
    const msgs = m.messages || [];
    const last = msgs.filter((x) => x.role === "assistant").pop();
    const txt = last ? String(last.text || last.content || "") : "";
    if (txt && txt === cur.restSeen && !cur.wsDeltas) {
      cur.t.textContent = txt;
      cur.text = txt;
      finishTurn("via thread");
    } else if (txt) {
      cur.restSeen = txt;
    }
  } catch (e) { /* backstop is best-effort; WS path remains primary */ }
}
function armRest() {
  clearInterval(S.restTimer);
  S.restTimer = setInterval(() => {
    if (!cur) clearInterval(S.restTimer);
    else restBackstop();
  }, 3000);
}
async function finishTurn(err) {
  if (!cur) return;
  const done = cur;
  cur = null;
  clearTimeout(S.quietTimer);
  clearInterval(S.restTimer);
  S.streaming = false;
  setBusy(false);
  if (err) done.m.textContent += " · " + err;
  S.turns += 1;
  setInfo();
  // Drain any queued partials, then (normal/verbose) a done-narration,
  // then speak only the unspoken remainder. If streaming spoke everything,
  // label it streamed (with first-audio ms).
  let guard = 0;
  while (S.pqBusy && guard++ < 600) await new Promise((r) => setTimeout(r, 100));
  if (S.verbosity !== "silent" && S.speak && !err && done.text.trim()) {
    try {
      const j = await fetchSpeech(narrLines().done);
      done.m.textContent += " · SPEAK[narrate]";
      await playUrl(j.data_url, false);
    } catch (e) { /* narration best-effort */ }
  }
  const rest = (done.text || "").slice(S.spoken).trim();
  if (S.speak && rest) {
    await speak(rest, done.m);
  } else if (S.speak && !rest && done.text.trim()) {
    const ms = S.firstAudioAt ? Math.round(S.firstAudioAt - S.submitAt) : -1;
    done.m.textContent += " · SPEAK[streamed first-audio:" + ms + "ms]";
  } else {
    await speak(done.text, done.m);
  }
  if (S.verbosity !== "silent" && S.speak && !err) note(" ");
  autoRestart();
}
function autoRestart() {
  // Hands-free loop: reply done -> mic reopens by itself.
  if (!S.cont || S.manualStop) { setState("IDLE"); return; }
  if (!micSupported()) { setState("IDLE"); return; }
  setState("LISTENING");
  startRec().then(() => { S.manualStop = false; }).catch((e) => {
    S.cont = false;
    $("contbtn").textContent = "🔁 Continuous: off";
    setState("IDLE");
    note("mic blocked: " + String((e && e.message) || e).slice(0, 80));
  });
}
async function submit(text) {
  if (!text.trim()) return;
  if (S.streaming) return;
  // Stop-phrases end hands-free instead of submitting (voice AND typed).
  if (S.cont && STOP_PATTERNS.test(text.trim())) {
    S.cont = false;
    $("contbtn").textContent = "🔁 Continuous: off";
    setState("IDLE");
    note("hands-free off — say hi whenever, sir.");
    return;
  }
  // Barge-in: new input during playback cancels it first.
  if (S.audio) {
    const why = stopPlayback("barge");
    await interruptTurn();
    note("Barge-in cancel: " + why + " in " + S.bargeMs.toFixed(1) + "ms");
  }
  if (!ensureWs()) await connectWs();
  const u = addTurn("you", "");
  u.t.textContent = text;
  cur = { t: el("div"), m: null, text: "", submitted: text, restSeen: "", wsDeltas: false };
  const d = el("div", "turn");
  d.appendChild(el("div", "who", "jarvis"));
  cur.t.className = "txt";
  cur.m = el("div", "meta", "listening…");
  d.appendChild(cur.t);
  d.appendChild(cur.m);
  $("thread").appendChild(d);
  $("thread").scrollTop = $("thread").scrollHeight;
  S.streaming = true;
  S.spoken = 0;
  S.firstAudioAt = 0;
  S.submitAt = performance.now();
  setBusy(true);
  setState("THINKING");
  try {
    await rpc("prompt.submit", { session_id: S.sid, text });
  } catch (e) {
    finishTurn("submit failed: " + String((e && e.message) || e).slice(0, 80));
  }
}
function setBusy(b) {
  ["ptt", "tog", "send"].forEach((id) => { $(id).disabled = b && id !== "kill"; });
  $("kill").disabled = !b;
}
function note(s) { $("micnote").textContent = s; }
// ---- mic ----
let AC = null;
function vuFrom(stream) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const src = AC.createMediaStreamSource(stream);
    const an = AC.createAnalyser();
    an.fftSize = 256;
    src.connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    const bar = $("vubar");
    S.silenceSince = 0;
    (function tick() {
      if (!S.recording) { bar.style.width = "0%"; return; }
      an.getByteFrequencyData(buf);
      let mx = 0;
      for (let i = 0; i < buf.length; i++) if (buf[i] > mx) mx = buf[i];
      bar.style.width = Math.round((mx / 255) * 100) + "%";
      // Client VAD: sustained sub-threshold level auto-stops (hands-free only).
      const now = performance.now();
      if (mx < VAD_LEVEL) {
        if (!S.silenceSince) S.silenceSince = now;
        else if (S.cont && now - S.silenceSince > VAD_SILENCE_MS) {
          note("silence — auto-stopping");
          stopRec();
          return;
        }
      } else {
        S.silenceSince = 0;
      }
      requestAnimationFrame(tick);
    })();
  } catch (e) { /* VU is decorative; recording works without it */ }
}
async function startRec() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const mime = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
  const rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  S.rec = rec;
  S.chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) S.chunks.push(e.data); };
  rec.onstop = onRecStop;
  stream.getTracks().forEach((t) => { S["track_" + t.kind] = t; });
  S.tracks = stream.getTracks();
  rec.start(250);
  S.recording = true;
  S.silenceSince = 0;
  vuFrom(stream);
  $("tog").textContent = "⏹ Stop";
  setState("LISTENING");
  note("recording…");
}
function stopRec() {
  if (S.rec && S.rec.state !== "inactive") S.rec.stop();
  S.recording = false;
  if (S.tracks) S.tracks.forEach((t) => { try { t.stop(); } catch (e) {} });
  $("tog").textContent = "🎙 Start";
  if (!S.streaming) setState("TRANSCRIBING");
}
async function onRecStop() {
  S.recording = false;
  $("vubar").style.width = "0%";
  const type = (S.rec && S.rec.mimeType) || "audio/webm";
  const blob = new Blob(S.chunks, { type });
  S.chunks = [];
  if (!blob.size) { note("empty recording — try again"); return; }
  const dataUrl = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
  note("transcribing…");
  let tr;
  try {
    const r = await fetch("/api/audio/transcribe", { method: "POST",
      credentials: "include", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data_url: dataUrl, mime_type: type }) });
    tr = await r.json();
    if (!r.ok || !tr.ok) throw new Error((tr && tr.detail) || ("transcribe HTTP " + r.status));
  } catch (e) {
    note("transcribe failed: " + String((e && e.message) || e).slice(0, 100));
    return;
  }
  const text = (tr.transcript || "").trim();
  if (!text) { note("heard silence — try again"); return; }
  note("heard (" + (tr.provider || "stt") + "): " + text.slice(0, 80));
  await submit(text);
}
function micSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
            window.MediaRecorder);
}
// ---- wiring ----
$("loginbtn").onclick = async () => {
  $("loginerr").textContent = "";
  try {
    const r = await fetch("/auth/password-login", { method: "POST",
      credentials: "include", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ provider: "basic", username: $("user").value,
                             password: $("pass").value }) });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error("login rejected (" + r.status + ")");
    $("pass").value = "";
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    setState("IDLE");
    await connectWs();
    try {
      const cfg = await (await fetch("/api/config?include_defaults=false",
        { credentials: "include" })).json();
      const p = ((cfg.display || {}).personality || "").toLowerCase();
      S.soul = (p === "ultron") ? "ultron" : "jarvis";
    } catch (e) { /* soul defaults to jarvis */ }
    const okMic = micSupported();
    $("ptt").disabled = !okMic;
    $("tog").disabled = !okMic;
    if (!okMic) {
      $("micnote").textContent = "No microphone API in this browser — type below, it talks back all the same.";
    } else {
      $("micnote").textContent = "Mic ready. Hold the button, or tap Start/Stop.";
    }
  } catch (e) {
    $("loginerr").textContent = "Login failed: " + String((e && e.message) || e).slice(0, 100);
  }
};
$("ptt").addEventListener("pointerdown", async (e) => {
  e.preventDefault();
  if (S.streaming && S.audio) { stopPlayback("barge"); await interruptTurn(); }
  try { await startRec(); } catch (err) {
    note("mic blocked: " + String((err && err.message) || err).slice(0, 80));
  }
});
$("ptt").addEventListener("pointerup", () => { if (S.recording) stopRec(); });
$("ptt").addEventListener("pointercancel", () => { if (S.recording) stopRec(); });
$("tog").onclick = async () => {
  if (S.recording) { S.manualStop = true; stopRec(); return; }
  S.manualStop = false;
  if (S.streaming && S.audio) { stopPlayback("barge"); await interruptTurn(); }
  try { await startRec(); } catch (err) {
    note("mic blocked: " + String((err && err.message) || err).slice(0, 80));
  }
};
$("send").onclick = () => {
  const v = $("textbox").value;
  $("textbox").value = "";
  submit(v);
};
$("textbox").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("send").click(); }
});
$("kill").onclick = async () => {
  stopPlayback("killed");
  const ok = await interruptTurn();
  if (cur) await finishTurn(ok ? "stopped by you" : "stop failed");
  else note("nothing running");
};
$("speakbtn").onclick = () => {
  S.speak = !S.speak;
  $("speakbtn").textContent = S.speak ? "🔊 Speak: on" : "🔇 Speak: off";
};
$("contbtn").onclick = async () => {
  S.cont = !S.cont;
  S.manualStop = false;
  $("contbtn").textContent = S.cont ? "🔁 Continuous: on" : "🔁 Continuous: off";
  if (S.cont && !S.recording && !S.streaming) {
    if (!micSupported()) {
      note("No microphone API — continuous needs a mic; text still works.");
      S.cont = false;
      $("contbtn").textContent = "🔁 Continuous: off";
      return;
    }
    setState("LISTENING");
    try { await startRec(); } catch (err) {
      S.cont = false;
      $("contbtn").textContent = "🔁 Continuous: off";
      setState("IDLE");
      note("mic blocked: " + String((err && err.message) || err).slice(0, 80));
    }
  } else if (!S.cont) {
    setState("IDLE");
    note("hands-free off.");
  }
};
$("verbbtn").onclick = () => {
  const i = (VERBOSITIES.indexOf(S.verbosity) + 1) % VERBOSITIES.length;
  S.verbosity = VERBOSITIES[i];
  $("verbbtn").textContent = "💬 Verbose: " + S.verbosity;
};
</script>
</body>
</html>
