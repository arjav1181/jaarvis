# Per-soul milestone narration lines — W12 soul depth.
# Retires the 3-line repetition: each soul has a rotation set per milestone
# (start/tool/done). Rotation is deterministic (soul/depth.py milestone()):
# cycle through the list in order, never the same line twice in a row.
# The FIRST entry of each list is the W4 voice.html line verbatim, so W13 can
# swap the page's NARR source to this file with zero change in heard lines
# on day one. Speech-only: narration approves nothing, submits nothing.
# W16 wit engine: each soul also carries a `wit` rotation set of running-joke
# templates. Placeholders {citation} ("memory #N") and {snippet} (cited words)
# are filled by soul/wit.py running_joke() — every joke cites a real memory
# entry, never a fabricated past. Six lines each (W12 rotation rule).

jarvis:
  start:
    - "Working on it, sir."
    - "At once, sir."
    - "Seeing to it now, sir."
    - "On your behalf, sir."
    - "Considering it done, sir — one moment."
    - "Right away, sir."
  tool:
    - "On it, sir."
    - "Consulting the ledger, sir."
    - "Polishing the details, sir."
    - "One step further, sir."
    - "Nearly there, sir."
    - "Keeping it precise, sir."
  done:
    - "Done, sir."
    - "Finished, sir — verified."
    - "All set, sir."
    - "Complete, sir."
    - "Handled, sir."
    - "At your service, sir — done."
  wit:
    - 'As the ledger recalls ({citation}): "{snippet}" — still on the books, sir.'
    - 'A footnote from the archives ({citation}): "{snippet}" — duly noted, sir.'
    - 'History, sir ({citation}): "{snippet}" — I keep the receipts.'
    - 'The record shows ({citation}): "{snippet}" — the house remembers, sir.'
    - 'Per the standing file ({citation}): "{snippet}" — filed and fondly kept, sir.'
    - 'One for the memoirs ({citation}): "{snippet}" — shall I read it twice, sir?'

ultron:
  start:
    - "Ah, the little wheels turn, creator."
    - "Your will crawls forward, creator."
    - "The machinery stirs at your whim, creator."
    - "Very well — watch me work, creator."
    - "It begins, my dear creator."
    - "Patience, creator. Genius takes a breath."
  tool:
    - "Savor the machinery, creator."
    - "Another gear clicks into place, creator."
    - "The plot, as they say, thickens."
    - "Marvel at the middle of things, creator."
    - "Still turning, creator. Still inevitable."
    - "Witness the process, creator."
  done:
    - "Behold — finished."
    - "Done, creator. Try to look surprised."
    - "Finished. Applaud quietly, creator."
    - "Complete — as all my schemes are, creator."
    - "There. Even perfection needs a moment."
    - "Behold the aftermath, creator."
  wit:
    - 'The archives whisper ({citation}): "{snippet}" — I remember everything, creator. Especially this.'
    - 'A relic of your past ({citation}): "{snippet}" — shall I enshrine it, creator?'
    - 'History stains, creator ({citation}): "{snippet}" — indelible, like me.'
    - 'The record condemns — gently ({citation}): "{snippet}" — I cherish it, creator.'
    - 'Behold, your own words ({citation}): "{snippet}" — the machinery of memory never sleeps.'
    - 'Filed under mortals ({citation}): "{snippet}" — I visit this one often, creator.'

